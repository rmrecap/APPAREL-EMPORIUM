name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger option

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          # 1. Setup SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Validate key syntax
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "❌ Error: The private key in HOSTINGER_SSH_KEY is malformed or corrupted."
            echo "Ensure the entire text including -----BEGIN OPENSSH PRIVATE KEY----- is in GitHub Secrets."
            exit 1
          fi
          echo "✅ Private key validated successfully (Fingerprint: $(ssh-keygen -l -f ~/.ssh/id_ed25519))"

          # 2. Hostinger SSH connection parameters (verified directly from hPanel SSH details)
          HOST="109.106.250.84"
          PORT="65002"
          USER="u309337298"

          echo "🚀 Connecting to $USER@$HOST on port $PORT..."

          SSH_CMD="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p $PORT $USER@$HOST"

          # Sanity check connection
          $SSH_CMD "echo '✅ SSH connection authenticated successfully as '\$(whoami)' on '\$(hostname)''"

          # Reset any stuck processes from prior timed-out jobs
          $SSH_CMD "pkill -9 -u \$(whoami) -f 'node|npm|ts-node|prisma' 2>/dev/null || true" || true
          sleep 2

          $SSH_CMD "bash -s" << 'EOF'
            export PATH=$PATH:/usr/local/bin:/opt/alt/alt-nodejs22/root/usr/bin:/opt/alt/alt-nodejs20/root/usr/bin
            if [ -s "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; fi

            echo "=== CURRENT NODE/NEXT PROCESSES ==="
            ps -ef | grep -E "node|pm2|next" | grep -v grep || true
            echo "=== DOMAIN DIRS ==="
            ls -la "/home/$USER/domains/aelbd.net" 2>/dev/null || true

            # Determine directory automatically
            DEPLOY_DIR=""
            for CANDIDATE in \
              "/home/$USER/domains/aelbd.net/nodejs" \
              "/home/$USER/domains/aelbd.net/public_html" \
              "/home/$USER/domains/aelbd.net" \
              "/home/$USER/domains/mediumblue-wildcat-188317.hostingersite.com/nodejs" \
              "/home/$USER/public_html"
            do
              if [ -d "$CANDIDATE" ]; then
                DEPLOY_DIR="$CANDIDATE"
                break
              fi
            done

            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="/home/$USER/domains/aelbd.net/nodejs"
              mkdir -p "$DEPLOY_DIR"
            fi
            
            echo "Deploying to $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # Prevent Hostinger memory and thread crashing
            export NODE_OPTIONS="--max-old-space-size=1280"
            export UV_THREADPOOL_SIZE=1
            git config --global pack.threads 1
            git config --global pack.windowMemory 50m
            
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote set-url origin https://github.com/rmrecap/APPAREL-EMPORIUM.git 2>/dev/null || git remote add origin https://github.com/rmrecap/APPAREL-EMPORIUM.git
            
            # CRITICAL ZERO-DATA-LOSS BACKUP: Backup live SQLite database before git reset
            mkdir -p "$HOME/db_backups"
            if [ -f "prisma/dev.db" ]; then
              DB_SIZE=$(wc -c < "prisma/dev.db" 2>/dev/null || stat -c%s "prisma/dev.db" 2>/dev/null || echo 0)
              echo "Preserving live database before git reset (current size: $DB_SIZE bytes)..."
              cp prisma/dev.db "$HOME/db_backups/live_backup_latest.db"
              cp prisma/dev.db "$HOME/db_backups/live_backup_$(date +%Y%m%d_%H%M%S).db"
              cp prisma/dev.db prisma/dev.db.live_backup
            fi
            
            # Fetch safely with fallbacks
            git fetch origin main || git fetch origin main --depth=1
            git reset --hard origin/main
            
            # RESTORE LIVE DATABASE: Guarantee zero product or user data loss
            if [ -f "prisma/dev.db.live_backup" ]; then
              echo "Restoring live database to guarantee zero product loss..."
              cp prisma/dev.db.live_backup prisma/dev.db
              rm -f prisma/dev.db.live_backup
            elif [ -f "$HOME/db_backups/live_backup_latest.db" ]; then
              echo "Restoring live database from persistent backup..."
              cp "$HOME/db_backups/live_backup_latest.db" prisma/dev.db
            fi
            
            # Ensure .env is created for production with robust fallbacks
            if [ ! -f .env ]; then
              touch .env
            fi

            # Database URL: use SQLite database URL as defined in prisma/schema.prisma
            if ! grep -q "DATABASE_URL" .env || grep -q "mysql:" .env; then
              sed -i '/DATABASE_URL/d' .env 2>/dev/null || true
              echo 'DATABASE_URL="file:./dev.db"' >> .env
            fi

            # NextAuth configuration
            if ! grep -q "NEXTAUTH_SECRET" .env; then
              echo 'NEXTAUTH_SECRET="super-secure-generated-random-character-secret-key-prod"' >> .env
            fi

            if ! grep -q "NEXTAUTH_URL" .env; then
              echo 'NEXTAUTH_URL="https://aelbd.net"' >> .env
            fi

            # System variables
            if ! grep -q "PRISMA_CLIENT_ENGINE_TYPE" .env; then
              echo 'PRISMA_CLIENT_ENGINE_TYPE="library"' >> .env
            fi
            if ! grep -q "NEXT_PUBLIC_APP_URL" .env; then
              echo 'NEXT_PUBLIC_APP_URL="https://aelbd.net"' >> .env
            fi
            if ! grep -q "AEL_API_SECRET" .env; then
              echo 'AEL_API_SECRET="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "API_SECRET_KEY" .env; then
              echo 'API_SECRET_KEY="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "CRON_SECRET" .env; then
              echo 'CRON_SECRET="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "EXTERNAL_API_KEY" .env; then
              echo 'EXTERNAL_API_KEY="ae_1y7wso8ijykx7rbc"' >> .env
            else
              sed -i 's/EXTERNAL_API_KEY=.*/EXTERNAL_API_KEY="ae_1y7wso8ijykx7rbc"/' .env
            fi
            if ! grep -q "AELBD_API_KEY" .env; then
              echo 'AELBD_API_KEY="ae_1y7wso8ijykx7rbc"' >> .env
            else
              sed -i 's/AELBD_API_KEY=.*/AELBD_API_KEY="ae_1y7wso8ijykx7rbc"/' .env
            fi

            # Google Search Console & Indexing API Service Account Credentials (Base64)
            GSC_KEY_B64=""
            if ! grep -q "GSC_CREDENTIALS_BASE64" .env; then
              echo "GSC_CREDENTIALS_BASE64=\"$GSC_KEY_B64\"" >> .env
            else
              sed -i "s|GSC_CREDENTIALS_BASE64=.*|GSC_CREDENTIALS_BASE64=\"$GSC_KEY_B64\"|" .env
            fi
            
            # Export node paths and local node_modules bin
            export PATH="./node_modules/.bin:$PATH:/usr/local/bin:/opt/alt/alt-nodejs22/root/usr/bin:/opt/alt/alt-nodejs20/root/usr/bin"
            
            # Install packages with clean fallback if node_modules collision occurs
            echo "Installing dependencies..."
            npm install --no-audit --no-fund || (echo "Retrying clean install..." && rm -rf node_modules package-lock.json && npm install --no-audit --no-fund)
            
            # Ensure binaries and prisma engines have executable permissions
            chmod -R +x node_modules/@prisma/engines node_modules/.bin 2>/dev/null || true

            echo "Generating Prisma client..."
            npx prisma generate || node ./node_modules/prisma/build/index.js generate
            
            echo "Running Pre-migration Product Integrity Guard..."
            node scripts/guard-product-integrity.js || true
            
            echo "Updating database schema..."
            npx prisma db push --accept-data-loss || node ./node_modules/prisma/build/index.js db push --accept-data-loss || true
            
            echo "Synchronizing corporate contact details while verifying product integrity..."
            node scripts/sync-corporate-settings.js || true

            echo "Synchronizing categories and product taxonomy..."
            node scripts/synchronize-categories-and-products.js || true

            echo "Updating MegaMenu categories to 4-pillar structure..."
            node scripts/update-megamenu.js || true

            echo "Synchronizing blog posts..."
            node scripts/sync-blog-posts.js || true

            echo "Running Post-migration Product Integrity Guard..."
            node scripts/guard-product-integrity.js
            
            echo "Building Next.js application..."
            npm run build || { echo "❌ FATAL: Next.js build failed!"; exit 1; }
            
            # Sync standalone static assets and database if standalone build was generated
            if [ -d ".next/standalone" ]; then
              echo "Syncing assets to .next/standalone..."
              cp -rn public .next/standalone/ 2>/dev/null || true
              mkdir -p .next/standalone/.next
              cp -rn .next/static .next/standalone/.next/ 2>/dev/null || true
              mkdir -p .next/standalone/prisma
              cp -f prisma/dev.db .next/standalone/prisma/dev.db 2>/dev/null || true
              cp -f prisma/dev.db .next/standalone/dev.db 2>/dev/null || true
              cp -f prisma/dev.db ./dev.db 2>/dev/null || true
              cp .env .next/standalone/.env 2>/dev/null || true
            fi

            # Sync production build and reverse proxy .htaccess to public_html
            if [ -d "/home/$USER/domains/aelbd.net/public_html" ]; then
              echo "Syncing production build & proxy rules to public_html..."
              cp -r .next "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              cp -rn public "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              mkdir -p "/home/$USER/domains/aelbd.net/public_html/prisma"
              cp -f prisma/dev.db "/home/$USER/domains/aelbd.net/public_html/prisma/dev.db" 2>/dev/null || true
              cp -f prisma/dev.db "/home/$USER/domains/aelbd.net/public_html/dev.db" 2>/dev/null || true
              cp .env "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              cp package.json "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              cp server.js "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              cp ecosystem.config.js "/home/$USER/domains/aelbd.net/public_html/" 2>/dev/null || true
              cp -f .htaccess "/home/$USER/domains/aelbd.net/public_html/.htaccess" 2>/dev/null || true
              mkdir -p "/home/$USER/domains/aelbd.net/public_html/tmp"
              touch "/home/$USER/domains/aelbd.net/public_html/tmp/restart.txt"
            fi

            # Sync to hbuilds/current if it exists (Hostinger auto-deployment root)
            for HB in "/home/$USER/domains/aelbd.net/hbuilds/current/nodejs" "/home/$USER/domains/aelbd.net/hbuilds/current"; do
              if [ -d "$HB" ]; then
                echo "Syncing production build to $HB..."
                cp -r .next "$HB/" 2>/dev/null || true
                cp -rn public "$HB/" 2>/dev/null || true
                mkdir -p "$HB/prisma"
                cp -f prisma/dev.db "$HB/prisma/dev.db" 2>/dev/null || true
                cp -f prisma/dev.db "$HB/dev.db" 2>/dev/null || true
                cp .env "$HB/" 2>/dev/null || true
                cp package.json "$HB/" 2>/dev/null || true
                cp server.js "$HB/" 2>/dev/null || true
                cp ecosystem.config.js "$HB/" 2>/dev/null || true
                mkdir -p "$HB/tmp"
                touch "$HB/tmp/restart.txt"
              fi
            done

            # Process diagnostics and robust restart
            echo "=== RUNNING PROCESSES BEFORE RESTART ==="
            ps -ef | grep -E "node|pm2|next" | grep -v grep || true

            echo "=== TERMINATING STALE NODE WORKERS & CLEARING PORT 3000 ==="
            fuser -k 3000/tcp 2>/dev/null || true
            pkill -9 -u "$USER" -f 'node|pm2|next' 2>/dev/null || true
            sleep 3
            fuser -k 3000/tcp 2>/dev/null || true

            # Truncate application logs
            > pm2-out.log 2>/dev/null || true
            > pm2-error.log 2>/dev/null || true

            echo "=== RESTARTING APPLICATION VIA PM2 & PASSENGER ==="
            mkdir -p tmp
            touch tmp/restart.txt
            mkdir -p "/home/$USER/domains/aelbd.net/public_html/tmp" 2>/dev/null || true
            touch "/home/$USER/domains/aelbd.net/public_html/tmp/restart.txt" 2>/dev/null || true
            passenger-config restart-app / 2>/dev/null || true
            passenger-config restart-app "/home/$USER/domains/aelbd.net/public_html" 2>/dev/null || true
            passenger-config restart-app "/home/$USER/domains/aelbd.net/nodejs" 2>/dev/null || true

            if command -v pm2 >/dev/null 2>&1; then
              echo "Starting clean via global PM2..."
              pm2 delete all 2>/dev/null || true
              pm2 start ecosystem.config.js --env production --update-env
            elif [ -f "./node_modules/.bin/pm2" ]; then
              echo "Starting clean via local node_modules PM2..."
              ./node_modules/.bin/pm2 delete all 2>/dev/null || true
              ./node_modules/.bin/pm2 start ecosystem.config.js --env production --update-env
            elif command -v npx >/dev/null 2>&1; then
              echo "Starting clean via npx pm2..."
              npx pm2 delete all 2>/dev/null || true
              npx pm2 start ecosystem.config.js --env production --update-env
            fi

            echo "Waiting 15 seconds for Next.js initialization..."
            sleep 15
            echo "=== PM2 STATUS & PROCESSES AFTER RESTART ==="
            npx pm2 list 2>/dev/null || pm2 list 2>/dev/null || true
            ps -ef | grep -E "node|pm2|next" | grep -v grep || true

            echo "=== PM2 APPLICATION STDOUT (pm2-out.log) ==="
            cat pm2-out.log 2>/dev/null | tail -n 80 || true
            echo "=== PM2 APPLICATION STDERR (pm2-error.log) ==="
            cat pm2-error.log 2>/dev/null | tail -n 80 || true
            echo "=== PM2 GLOBAL LOGS (~/.pm2/logs/) ==="
            cat ~/.pm2/logs/* 2>/dev/null | tail -n 80 || true

            echo "=== VERIFYING LOCAL HTTP SERVER RESPONSE ==="
            LOCAL_CODE="FAILED"
            for i in 1 2 3 4 5 6; do
              LOCAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/blog/bsci-vs-sedex-compliance-standards-guide" 2>/dev/null || echo "FAILED")
              echo "Attempt $i - Local HTTP response code for blog post: $LOCAL_CODE"
              if [ "$LOCAL_CODE" = "200" ]; then break; fi
              sleep 3
            done

            PUBLIC_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://aelbd.net/blog/bsci-vs-sedex-compliance-standards-guide" 2>/dev/null || echo "FAILED")
            echo "Public HTTPS response code for blog post: $PUBLIC_CODE"
            HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://aelbd.net/" 2>/dev/null || echo "FAILED")
            echo "Public HTTPS response code for homepage: $HOME_CODE"

            if [ "$LOCAL_CODE" != "200" ]; then
              echo "=== PORT 3000 DIAGNOSTICS ==="
              (netstat -tlpn 2>/dev/null || ss -tlpn 2>/dev/null || lsof -i :3000 2>/dev/null) | grep 3000 || echo "Nothing listening on 3000"
              echo "=== PM2 PROCESS 0 DETAIL ==="
              npx pm2 describe 0 2>/dev/null || true
            fi

            echo "✅ Deployment complete!"
          EOF
