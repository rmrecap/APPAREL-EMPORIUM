name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger option

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          # 1. Setup SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Validate key syntax
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "❌ Error: The private key in HOSTINGER_SSH_KEY is malformed or corrupted."
            echo "Ensure the entire text including -----BEGIN OPENSSH PRIVATE KEY----- is in GitHub Secrets."
            exit 1
          fi
          echo "✅ Private key validated successfully (Fingerprint: $(ssh-keygen -l -f ~/.ssh/id_ed25519))"

          # 2. Hostinger SSH connection parameters (verified directly from hPanel SSH details)
          HOST="109.106.250.84"
          PORT="65002"
          USER="u309337298"

          echo "🚀 Connecting to $USER@$HOST on port $PORT..."

          SSH_CMD="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p $PORT $USER@$HOST"

          # Sanity check connection
          $SSH_CMD "echo '✅ SSH connection authenticated successfully as '\$(whoami)' on '\$(hostname)''"

          # Reset any stuck processes from prior timed-out jobs
          $SSH_CMD "killall -9 node npm ts-node prisma 2>/dev/null || true" || true
          sleep 2

          $SSH_CMD "bash -s" << 'EOF'
            export PATH=$PATH:/usr/local/bin:/opt/alt/alt-nodejs22/root/usr/bin:/opt/alt/alt-nodejs20/root/usr/bin
            if [ -s "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; fi

            # Determine directory automatically
            DEPLOY_DIR=""
            for CANDIDATE in \
              "/home/$USER/domains/aelbd.net/nodejs" \
              "/home/$USER/domains/aelbd.net/public_html" \
              "/home/$USER/domains/aelbd.net" \
              "/home/$USER/domains/mediumblue-wildcat-188317.hostingersite.com/nodejs" \
              "/home/$USER/public_html"
            do
              if [ -d "$CANDIDATE" ]; then
                DEPLOY_DIR="$CANDIDATE"
                break
              fi
            done

            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="/home/$USER/domains/aelbd.net/nodejs"
              mkdir -p "$DEPLOY_DIR"
            fi
            
            echo "Deploying to $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # Prevent Hostinger memory and thread crashing
            export NODE_OPTIONS="--max-old-space-size=1280"
            export UV_THREADPOOL_SIZE=1
            git config --global pack.threads 1
            git config --global pack.windowMemory 50m
            
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote set-url origin https://github.com/rmrecap/APPAREL-EMPORIUM.git 2>/dev/null || git remote add origin https://github.com/rmrecap/APPAREL-EMPORIUM.git
            
            # CRITICAL ZERO-DATA-LOSS BACKUP: Backup live SQLite database before git reset
            mkdir -p "$HOME/db_backups"
            if [ -f "prisma/dev.db" ]; then
              DB_SIZE=$(wc -c < "prisma/dev.db" 2>/dev/null || stat -c%s "prisma/dev.db" 2>/dev/null || echo 0)
              echo "Preserving live database before git reset (current size: $DB_SIZE bytes)..."
              cp prisma/dev.db "$HOME/db_backups/live_backup_latest.db"
              cp prisma/dev.db "$HOME/db_backups/live_backup_$(date +%Y%m%d_%H%M%S).db"
              cp prisma/dev.db prisma/dev.db.live_backup
            fi
            
            # Fetch safely with fallbacks
            git fetch origin main || git fetch origin main --depth=1
            git reset --hard origin/main
            
            # RESTORE LIVE DATABASE: Guarantee zero product or user data loss
            if [ -f "prisma/dev.db.live_backup" ]; then
              echo "Restoring live database to guarantee zero product loss..."
              cp prisma/dev.db.live_backup prisma/dev.db
              rm -f prisma/dev.db.live_backup
            elif [ -f "$HOME/db_backups/live_backup_latest.db" ]; then
              echo "Restoring live database from persistent backup..."
              cp "$HOME/db_backups/live_backup_latest.db" prisma/dev.db
            fi
            
            # Ensure .env is created for production with robust fallbacks
            if [ ! -f .env ]; then
              touch .env
            fi

            # Database URL: use SQLite database URL as defined in prisma/schema.prisma
            if ! grep -q "DATABASE_URL" .env || grep -q "mysql:" .env; then
              sed -i '/DATABASE_URL/d' .env 2>/dev/null || true
              echo 'DATABASE_URL="file:./dev.db"' >> .env
            fi

            # NextAuth configuration
            if ! grep -q "NEXTAUTH_SECRET" .env; then
              echo 'NEXTAUTH_SECRET="super-secure-generated-random-character-secret-key-prod"' >> .env
            fi

            if ! grep -q "NEXTAUTH_URL" .env; then
              echo 'NEXTAUTH_URL="https://aelbd.net"' >> .env
            fi

            # System variables
            if ! grep -q "PRISMA_CLIENT_ENGINE_TYPE" .env; then
              echo 'PRISMA_CLIENT_ENGINE_TYPE="library"' >> .env
            fi
            if ! grep -q "NEXT_PUBLIC_APP_URL" .env; then
              echo 'NEXT_PUBLIC_APP_URL="https://aelbd.net"' >> .env
            fi
            if ! grep -q "AEL_API_SECRET" .env; then
              echo 'AEL_API_SECRET="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "API_SECRET_KEY" .env; then
              echo 'API_SECRET_KEY="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "CRON_SECRET" .env; then
              echo 'CRON_SECRET="ael_secret_key_2026_xyz"' >> .env
            fi
            if ! grep -q "EXTERNAL_API_KEY" .env; then
              echo 'EXTERNAL_API_KEY="ae_1y7wso8ijykx7rbc"' >> .env
            else
              sed -i 's/EXTERNAL_API_KEY=.*/EXTERNAL_API_KEY="ae_1y7wso8ijykx7rbc"/' .env
            fi
            if ! grep -q "AELBD_API_KEY" .env; then
              echo 'AELBD_API_KEY="ae_1y7wso8ijykx7rbc"' >> .env
            else
              sed -i 's/AELBD_API_KEY=.*/AELBD_API_KEY="ae_1y7wso8ijykx7rbc"/' .env
            fi
            
            # Export node paths and local node_modules bin
            export PATH="./node_modules/.bin:$PATH:/usr/local/bin:/opt/alt/alt-nodejs22/root/usr/bin:/opt/alt/alt-nodejs20/root/usr/bin"
            
            # Install packages with clean fallback if node_modules collision occurs
            echo "Installing dependencies..."
            npm install --no-audit --no-fund || (echo "Retrying clean install..." && rm -rf node_modules package-lock.json && npm install --no-audit --no-fund)
            
            # Ensure binaries and prisma engines have executable permissions
            chmod -R +x node_modules/@prisma/engines node_modules/.bin 2>/dev/null || true

            echo "Generating Prisma client..."
            npx prisma generate || node ./node_modules/prisma/build/index.js generate
            
            echo "Running Pre-migration Product Integrity Guard..."
            node scripts/guard-product-integrity.js || true
            
            echo "Updating database schema..."
            npx prisma db push --accept-data-loss || node ./node_modules/prisma/build/index.js db push --accept-data-loss || true
            
            echo "Synchronizing corporate contact details while verifying product integrity..."
            node scripts/sync-corporate-settings.js || true

            echo "Updating MegaMenu categories to strict 3-pillar structure..."
            node scripts/update-megamenu.js || true

            echo "Running Post-migration Product Integrity Guard..."
            node scripts/guard-product-integrity.js
            
            echo "Building Next.js application..."
            npm run build
            
            # Restart application across Passenger and PM2
            echo "Restarting application service..."
            mkdir -p tmp
            touch tmp/restart.txt
            if [ -d "/home/$USER/domains/aelbd.net/hbuilds/current/nodejs" ]; then
              mkdir -p "/home/$USER/domains/aelbd.net/hbuilds/current/nodejs/tmp"
              touch "/home/$USER/domains/aelbd.net/hbuilds/current/nodejs/tmp/restart.txt" 2>/dev/null || true
            fi
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production 2>/dev/null || pm2 restart all 2>/dev/null || true
            fi
            echo "✅ Deployment complete!"
          EOF
