name: Automated Google Drive Backup

on:
  schedule:
    # Runs at 00:00 UTC every day (12:00 AM)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-backup:
    name: Trigger Google Drive Vault Backup
    runs-on: ubuntu-latest
    steps:
      - name: Send Backup Request to Server
        run: |
          APP_URL="${{ secrets.APP_URL || 'https://aelbd.net' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Triggering automated backup on $APP_URL..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/admin/backup/gdrive" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Backup successfully triggered and uploaded to Google Drive!"
            exit 0
          else
            echo "❌ Backup trigger failed with status $HTTP_STATUS"
            exit 1
          fi
